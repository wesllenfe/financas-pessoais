<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/transactions"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditing ? 'Editar' : 'Nova' }} Transação</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="form-card">
    <form (ngSubmit)="saveTransaction()" #form="ngForm">
      <div class="form-header">
        <ion-icon name="wallet-outline"></ion-icon>
        <h2>{{ isEditing ? 'Editar detalhes da transação' : 'Adicionar nova transação' }}</h2>
      </div>

      <div class="form-group">
        <ion-label position="stacked">Descrição</ion-label>
        <ion-input
          [(ngModel)]="transaction.description"
          name="description"
          required
          placeholder="Ex: Compra no supermercado"
          #descriptionInput="ngModel"
          class="custom-input"
        ></ion-input>
        <div *ngIf="descriptionInput.invalid && (descriptionInput.dirty || descriptionInput.touched)" class="error-message">
          <div *ngIf="descriptionInput.errors?.['required']">Descrição é obrigatória</div>
        </div>
      </div>

      <div class="form-group">
        <ion-label position="stacked">Valor</ion-label>
        <ion-input
          [(ngModel)]="displayAmount"
          name="amount"
          required
          placeholder="0,00"
          #amountInput="ngModel"
          class="custom-input"
          (ionInput)="formatCurrency($event)"
          (ionBlur)="updateAmount()"
        >
          <ion-icon name="cash-outline" slot="start" class="input-icon"></ion-icon>
        </ion-input>
        <div *ngIf="amountInput.invalid && (amountInput.dirty || amountInput.touched)" class="error-message">
          <div *ngIf="amountInput.errors?.['required']">Valor é obrigatório</div>
        </div>
      </div>

      <div class="form-group">
        <ion-label position="stacked">Tipo</ion-label>
        <div class="type-selector">
          <div
            class="type-option"
            [class.active]="transaction.type === 'income'"
            (click)="transaction.type = 'income'"
          >
            <div class="type-icon income">
              <ion-icon name="arrow-up-outline"></ion-icon>
            </div>
            <span>Entrada</span>
          </div>
          <div
            class="type-option"
            [class.active]="transaction.type === 'expense'"
            (click)="transaction.type = 'expense'"
          >
            <div class="type-icon expense">
              <ion-icon name="arrow-down-outline"></ion-icon>
            </div>
            <span>Saída</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <ion-label position="stacked">Categoria</ion-label>
        <ion-select
          [(ngModel)]="transaction.category"
          name="category"
          required
          interface="action-sheet"
          class="custom-select"
          placeholder="Selecione uma categoria"
        >
          <ion-select-option *ngFor="let category of (categories$ | async)" [value]="category">
            {{ category }}
          </ion-select-option>
        </ion-select>
      </div>

      <div class="form-group">
        <ion-label position="stacked">Data</ion-label>
        <ion-datetime-button datetime="datetime" class="custom-date-button"></ion-datetime-button>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime
              id="datetime"
              [(ngModel)]="transaction.date"
              name="date"
              presentation="date"
              [showDefaultButtons]="true"
              doneText="Confirmar"
              cancelText="Cancelar"
            ></ion-datetime>
          </ng-template>
        </ion-modal>
      </div>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="form.invalid"
        class="save-button"
      >
        <ion-icon name="save-outline" slot="start"></ion-icon>
        {{ isEditing ? 'Atualizar' : 'Salvar' }}
      </ion-button>
    </form>
  </ion-card>
</ion-content>
